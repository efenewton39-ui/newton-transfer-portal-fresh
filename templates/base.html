<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Newton Transfer Portal{% endblock %}</title><style>
body{margin:0;background:#f3f6fb;color:#18233a;font:16px system-ui}header{background:#101b34;color:white;padding:18px max(16px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}header a{color:white;margin-right:12px;text-decoration:none}main{max-width:1000px;margin:26px auto;padding:0 15px}.card{background:white;border:1px solid #e0e6ef;border-radius:13px;padding:22px;margin:14px 0}h1{font-size:clamp(1.6rem,4vw,2.3rem)}p{line-height:1.5;color:#526078}.btn,button{display:inline-block;background:#2458c5;color:white;border:0;border-radius:8px;padding:11px 15px;text-decoration:none;font:inherit;cursor:pointer}.secondary{background:#e9eef8;color:#20345d}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd4e2;border-radius:8px;font:inherit}textarea{min-height:90px}.row,.stats{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.stat{background:#edf3ff;padding:15px;border-radius:9px}.stat strong{display:block;font-size:1.6rem}.flash{background:#fff2d6;padding:12px;border-radius:8px;margin:10px 0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid #e4eaf2;white-space:nowrap}.pill{background:#edf1f7;border-radius:30px;padding:4px 9px}@media print{body{background:white}header,footer,.no-print{display:none!important}main{max-width:none;margin:0;padding:0}.card{border:0;box-shadow:none;padding:8px;margin:0}a{color:black;text-decoration:none}p{color:#111}}footer{text-align:center;color:#778198;padding:25px;font-size:13px}</style></head><body><header><b>NEWTON TRANSFER PORTAL</b><nav><a href="/">Home</a><a href="/track">Track</a>{% if session.get('admin') %}<a href="/dashboard">Dashboard</a><form style="display:inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="secondary">Log out</button></form>{% else %}<a href="/login">Admin</a>{% endif %}</nav></header><main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Record tracking only — this site does not process payments.</footer></body></html>
