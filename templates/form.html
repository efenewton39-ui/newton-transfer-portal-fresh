{% extends "base.html" %}{% block content %}<section class="card"><h1>{{'Edit' if editing else 'Create'}} transfer record</h1><p>Record details only; setting a status does not move money or independently verify a transfer.</p><form method="post"><input type="hidden" name="csrf" value="{{csrf()}}"><div class="row"><div><label>Sender name *</label><input name="sender" maxlength="120" value="{{d.get('sender','')}}" required></div><div><label>Recipient name *</label><input name="recipient" maxlength="120" value="{{d.get('recipient','')}}" required></div></div><div class="row"><div><label>Amount *</label><input name="amount" inputmode="decimal" value="{{d.get('amount','')}}" required></div><div><label>Currency *</label><select name="currency">{% for c in CURRENCIES %}<option {% if d.get('currency','USD')==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></div></div><div class="row"><div><label>Destination country/details</label><input name="destination" maxlength="200" placeholder="e.g. Mexico" value="{{d.get('destination','')}}"></div><div><label>Provider details</label><input name="provider" maxlength="120" value="{{d.get('provider','')}}"></div></div><label>Status</label><select name="status">{% for s in STATUSES %}<option {% if d.get('status','Draft')==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><label>Internal note</label><textarea name="note" maxlength="1000">{{d.get('note','')}}</textarea><p><button>{{'Save changes' if editing else 'Create record'}}</button> <a class="btn secondary" href="/dashboard">Cancel</a></p></form></section>{% endblock %}
